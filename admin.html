<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Rycolyn Enterprise | Admin Portal</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>

    }

    .topbar {

    }

    .detail {
      margin: 7px 0;

    }

    .status-row {

      margin-top: 22px;

    }

    .payment-section h4 {
      margin-bottom: 12px;

    }

      display: grid;
      grid-template-columns: 1fr 1fr;

    }

    .payment-status {

      background: #eef4f8;

    }

    }

    }

    .payment-status.cancelled {

    }

    .payment-link {
      display: block;
      margin-top: 10px;

    }

    .empty {

      color: #667085;
    }

    .error {
      color: #b42318;
      margin-top: 12px;

    }

    }

    .hidden {

    }

    @media (max-width: 650px) {
      .status-row,

        grid-template-columns: 1fr;

        flex: 1;
      }
    }
  </style></head><body>  <header class="header">
    <h1>RYCOLYN ENTERPRISE</h1>
    <p>Admin Portal</p>
  </header>  <main class="container"><!-- LOGIN -->
<section id="loginSection" class="login-card">

  <h2>Administrator Login</h2>

  <form id="loginForm">

    <label for="email">Email</label>

    <input
      type="email"
      id="email"
      required
      autocomplete="email"
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      required
      autocomplete="current-password"
    >

    <button class="primary" type="submit">
      Sign In
    </button>

    <p id="loginError" class="error"></p>

  </form>

</section>


<!-- DASHBOARD -->
<section id="dashboardSection" class="dashboard hidden">

  <div class="topbar">

    <div>
      <h2>Service Requests</h2>
      <p id="adminEmail"></p>
    </div>

    <div class="actions">

      <button class="refresh" id="refreshButton">
        Refresh
      </button>

      <button class="logout" id="logoutButton">
        Sign Out
      </button>

    </div>

  </div>

  <div id="requestsContainer"></div>

  <p id="dashboardMessage"></p>

</section>

  </main><script>

  const SUPABASE_URL =
    "https://askvkdgdlbsjcdcwosof.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ZAmEaqe4HFkiq1vqOeNs1w_czxoSxAT";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginSection =
    document.getElementById("loginSection");

  const dashboardSection =
    document.getElementById("dashboardSection");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");

  const adminEmail =
    document.getElementById("adminEmail");

  const requestsContainer =
    document.getElementById("requestsContainer");

  const dashboardMessage =
    document.getElementById("dashboardMessage");


  async function checkAdmin(user) {

    const { data, error } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error) {

      console.error(error);

      return false;
    }

    return !!data;
  }


  async function loadRequests() {

    requestsContainer.innerHTML =
      "<p>Loading requests...</p>";

    const { data, error } =
      await supabaseClient
        .from("service_requests")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      requestsContainer.innerHTML =
        "<p class='error'>Unable to load service requests.</p>";

      return;
    }


    if (!data || data.length === 0) {

      requestsContainer.innerHTML =
        "<div class='empty'>No service requests yet.</div>";

      return;
    }


    const paymentResults =
      await Promise.all(
        data.map(async request => {

          const { data: payment } =
            await supabaseClient
              .from("payments")
              .select("*")
              .eq("service_request_id", request.id)
              .order("created_at", {
                ascending: false
              })
              .limit(1)
              .maybeSingle();

          return {
            requestId: request.id,
            payment: payment || null
          };

        })
      );


    const paymentMap = {};

    paymentResults.forEach(item => {
      paymentMap[item.requestId] = item.payment;
    });


    requestsContainer.innerHTML =
      data.map(request => {

        const payment =
          paymentMap[request.id];


        const paymentHtml =
          payment
            ? renderExistingPayment(payment)
            : renderNewPaymentForm(request);


        return `

        <article class="request">

          <h3>
            ${escapeHtml(
              request.full_name ||
              "Unnamed Client"
            )}
          </h3>

          <div class="detail">
            <strong>Email:</strong>
            ${escapeHtml(request.email || "")}
          </div>

          <div class="detail">
            <strong>Country:</strong>
            ${escapeHtml(
              request.country ||
              "Not provided"
            )}
          </div>

          <div class="detail">
            <strong>Service:</strong>
            ${escapeHtml(
              request.service_type || ""
            )}
          </div>

          <div class="detail">
            <strong>Date:</strong>
            ${escapeHtml(
              request.preferred_date ||
              "Not specified"
            )}
          </div>

          <div class="detail">
            <strong>Time:</strong>
            ${escapeHtml(
              request.preferred_time ||
              "Not specified"
            )}
          </div>

          <div class="detail">
            <strong>Duration:</strong>
            ${escapeHtml(
              request.duration ||
              "Not specified"
            )}
          </div>

          <div class="detail">
            <strong>Language:</strong>
            ${escapeHtml(
              request.preferred_language ||
              "Not specified"
            )}
          </div>

          <div class="detail">
            <strong>Description:</strong><br>
            ${escapeHtml(
              request.description || ""
            )}
          </div>

          <div class="detail">
            <strong>Submitted:</strong>
            ${escapeHtml(
              request.created_at
                ? new Date(
                    request.created_at
                  ).toLocaleString()
                : ""
            )}
          </div>


          <div class="status-row">

            <div>

              <label>Status</label>

              <select
                onchange="updateRequestStatus(
                  '${request.id}',
                  this.value
                )"
              >

                <option value="new"
                  ${request.status === "new"
                    ? "selected"
                    : ""}>
                  New
                </option>

                <option value="reviewing"
                  ${request.status === "reviewing"
                    ? "selected"
                    : ""}>
                  Reviewing
                </option>

                <option value="accepted"
                  ${request.status === "accepted"
                    ? "selected"
                    : ""}>
                  Accepted
                </option>

                <option value="payment_required"
                  ${request.status === "payment_required"
                    ? "selected"
                    : ""}>
                  Payment Required
                </option>

                <option value="paid"
                  ${request.status === "paid"
                    ? "selected"
                    : ""}>
                  Paid
                </option>

                <option value="completed"
                  ${request.status === "completed"
                    ? "selected"
                    : ""}>
                  Completed
                </option>

                <option value="cancelled"
                  ${request.status === "cancelled"
                    ? "selected"
                    : ""}>
                  Cancelled
                </option>

              </select>

            </div>


            <div>

              <label>Admin Notes</label>

              <textarea
                id="notes-${request.id}"
                placeholder="Private admin notes..."
              >${escapeHtml(
                request.admin_notes || ""
              )}</textarea>          <button
            class="refresh"
            style="margin-top:8px;"
            onclick="saveNotes(
              '${request.id}'
            )"
          >
            Save Notes
          </button>

        </div>

      </div>


      <!-- PAYMENT SECTION -->

      <div class="payment-section">

        <h4>💳 Payment Management</h4>

        ${paymentHtml}

      </div>

    </article>

    `;

  }).join("");

}

function renderNewPaymentForm(request) {

return `

  <div class="payment-grid">

    <div>

      <label>
        Amount
      </label>

      <input
        type="number"
        id="amount-${request.id}"
        min="0"
        step="0.01"
        placeholder="e.g. 10"
      >

    </div>


    <div>

      <label>
        Currency
      </label>

      <select
        id="currency-${request.id}"
      >

        <option value="USD">
          USD
        </option>

        <option value="KES">
          KES
        </option>

        <option value="GBP">
          GBP
        </option>

        <option value="EUR">
          EUR
        </option>

        <option value="CAD">
          CAD
        </option>

        <option value="AUD">
          AUD
        </option>

      </select>

    </div>


    <div>

      <label>
        Payment Method
      </label>

      <select
        id="method-${request.id}"
      >

        <option value="mpesa">
          M-Pesa
        </option>

        <option value="card">
          Card
        </option>

        <option value="paypal">
          PayPal
        </option>

        <option value="bank">
          Bank Transfer
        </option>

        <option value="other">
          Other
        </option>

      </select>

    </div>


    <div>

      <label>
        Payment Link
      </label>

      <input
        type="url"
        id="link-${request.id}"
        placeholder="Paste payment link when available"
      >

    </div>

  </div>


  <label>
    Payment Notes
  </label>

  <textarea
    id="payment-notes-${request.id}"
    placeholder="Optional payment instructions or notes..."
  ></textarea>


  <button
    class="payment-button"
    onclick="createPayment(
      '${request.id}',
      '${escapeJs(request.full_name || "")}',
      '${escapeJs(request.email || "")}'
    )"
  >
    Create Payment Request
  </button>

`;

}

function renderExistingPayment(payment) {

const status =
  payment.payment_status || "pending";

const statusClass =
  escapeHtml(status);


let paidDate = "";

if (payment.paid_at) {

  paidDate =
    `<div class="detail">
      <strong>Paid:</strong>
      ${escapeHtml(
        new Date(
          payment.paid_at
        ).toLocaleString()
      )}
    </div>`;

}


let linkHtml = "";

if (payment.payment_link) {

  linkHtml = `
    <a
      class="payment-link"
      href="${escapeHtml(
        payment.payment_link
      )}"
      target="_blank"
      rel="noopener noreferrer"
    >
      Open Payment Link
    </a>
  `;

}


return `

  <div class="detail">
    <strong>Amount:</strong>
    ${escapeHtml(
      payment.amount
    )}
    ${escapeHtml(
      payment.currency
    )}
  </div>


  <div class="detail">
    <strong>Method:</strong>
    ${escapeHtml(
      payment.payment_method ||
      "Not specified"
    )}
  </div>


  <div class="detail">
    <strong>Reference:</strong>
    ${escapeHtml(
      payment.payment_reference ||
      "Not yet available"
    )}
  </div>


  <div class="payment-status ${statusClass}">
    Payment Status:
    ${escapeHtml(
      status.toUpperCase()
    )}
  </div>


  ${linkHtml}

  ${paidDate}


  <label>
    Update Payment Status
  </label>

  <select
    id="payment-status-${payment.id}"
  >

    <option value="pending"
      ${status === "pending"
        ? "selected"
        : ""}>
      Pending
    </option>

    <option value="paid"
      ${status === "paid"
        ? "selected"
        : ""}>
      Paid
    </option>

    <option value="failed"
      ${status === "failed"
        ? "selected"
        : ""}>
      Failed
    </option>

    <option value="refunded"
      ${status === "refunded"
        ? "selected"
        : ""}>
      Refunded
    </option>

    <option value="cancelled"
      ${status === "cancelled"
        ? "selected"
        : ""}>
      Cancelled
    </option>

  </select>


  <label>
    Payment Reference
  </label>

  <input
    type="text"
    id="payment-reference-${payment.id}"
    value="${escapeHtml(
      payment.payment_reference ||
      ""
    )}"
    placeholder="Enter transaction/reference"
  >


  <button
    class="paid-button"
    onclick="updatePayment(
      '${payment.id}',
      '${payment.service_request_id}'
    )"
  >
    Save Payment Update
  </button>

`;

}

async function createPayment(
requestId,
clientName,
clientEmail
) {

const amountInput =
  document.getElementById(
    "amount-" + requestId
  );

const currencyInput =
  document.getElementById(
    "currency-" + requestId
  );

const methodInput =
  document.getElementById(
    "method-" + requestId
  );

const linkInput =
  document.getElementById(
    "link-" + requestId
  );

const notesInput =
  document.getElementById(
    "payment-notes-" + requestId
  );


const amount =
  parseFloat(
    amountInput.value
  );


if (
  !amount ||
  amount <= 0
) {

  alert(
    "Please enter a valid payment amount."
  );

  return;
}


const payment = {

  service_request_id:
    requestId,

  client_name:
    clientName,

  client_email:
    clientEmail,

  amount:
    amount,

  currency:
    currencyInput.value,

  payment_method:
    methodInput.value,

  payment_status:
    "pending",

  payment_link:
    linkInput.value.trim() ||
    null,

  notes:
    notesInput.value.trim() ||
    null

};


const { error } =
  await supabaseClient
    .from("payments")
    .insert([payment]);


if (error) {

  console.error(error);

  alert(
    "Could not create the payment request."
  );

  return;
}


await supabaseClient
  .from("service_requests")
  .update({
    status:
      "payment_required",

    updated_at:
      new Date().toISOString()
  })
  .eq(
    "id",
    requestId
  );


alert(
  "Payment request created successfully."
);


await loadRequests();

}

async function updatePayment(
paymentId,
requestId
) {

const statusInput =
  document.getElementById(
    "payment-status-" +
    paymentId
  );

const referenceInput =
  document.getElementById(
    "payment-reference-" +
    paymentId
  );


const status =
  statusInput.value;

const reference =
  referenceInput.value.trim() ||
  null;


const updateData = {

  payment_status:
    status,

  payment_reference:
    reference,

  updated_at:
    new Date().toISOString()

};


if (status === "paid") {

  updateData.paid_at =
    new Date().toISOString();

}


const { error } =
  await supabaseClient
    .from("payments")
    .update(updateData)
    .eq(
      "id",
      paymentId
    );


if (error) {

  console.error(error);

  alert(
    "Could not update the payment."
  );

  return;
}


if (status === "paid") {

  await supabaseClient
    .from("service_requests")
    .update({

      status:
        "paid",

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      requestId
    );

}


alert(
  "Payment information updated."
);


await loadRequests();

}

async function updateRequestStatus(
id,
status
) {

const { error } =
  await supabaseClient
    .from("service_requests")
    .update({

      status:
        status,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      id
    );


if (error) {

  alert(
    "Could not update the request."
  );

  console.error(error);

  return;
}


loadRequests();

}

async function saveNotes(id) {

const textarea =
  document.getElementById(
    "notes-" + id
  );

const notes =
  textarea.value.trim();


const { error } =
  await supabaseClient
    .from("service_requests")
    .update({

      admin_notes:
        notes,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      id
    );


if (error) {

  alert(
    "Could not save the notes."
  );

  console.error(error);

  return;
}


alert(
  "Private admin notes saved."
);

}

function escapeHtml(value) {

return String(value)
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

function escapeJs(value) {

return String(value)
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}

loginForm.addEventListener(
"submit",
async function(event) {

  event.preventDefault();

  loginError.textContent = "";


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const { data, error } =
    await supabaseClient.auth
      .signInWithPassword({

        email,
        password

      });


  if (error) {

    loginError.textContent =
      "Login failed. Please check your email and password.";

    console.error(error);

    return;
  }


  const user =
    data.user;


  const isAdmin =
    await checkAdmin(user);


  if (!isAdmin) {

    await supabaseClient.auth.signOut();

    loginError.textContent =
      "This account is not authorized as a Rycolyn administrator.";

    return;
  }


  showDashboard(user);

}

);

async function showDashboard(user) {

loginSection.classList.add(
  "hidden"
);

dashboardSection.classList.remove(
  "hidden"
);


adminEmail.textContent =
  "Signed in as: " +
  user.email;


await loadRequests();

}

document
.getElementById(
"refreshButton"
)
.addEventListener(
"click",
loadRequests
);

document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
async function() {

    await supabaseClient
      .auth
      .signOut();


    dashboardSection
      .classList
      .add("hidden");


    loginSection
      .classList
      .remove("hidden");


    loginForm.reset();

  }
);

async function initialize() {

const {
  data: {
    session
  }
} =
  await supabaseClient
    .auth
    .getSession();


if (!session) {

  return;
}


const isAdmin =
  await checkAdmin(
    session.user
  );


if (isAdmin) {

  showDashboard(
    session.user
  );

} else {

  await supabaseClient
    .auth
    .signOut();

}

}

initialize();

</script></body>
</html>
