<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rycolyn Enterprise | Admin Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #102a43;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin-bottom: 6px;
    }

    .header p {
      opacity: 0.85;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .login-card,
    .dashboard {
      background: white;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .login-card {
      max-width: 450px;
      margin: 50px auto;
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5df;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #102a43;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    .logout {
      background: #b42318;
      color: white;
    }

    .refresh {
      background: #dce8f5;
      color: #102a43;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .request {
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      background: #fbfdff;
    }

    .request h3 {
      margin-bottom: 12px;
    }

    .detail {
      margin: 7px 0;
      line-height: 1.5;
    }

    .status-row {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      color: #667085;
    }

    .error {
      color: #b42318;
      margin-top: 12px;
      line-height: 1.5;
    }

    .success {
      color: #067647;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 650px) {
      .status-row {
        grid-template-columns: 1fr;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>RYCOLYN ENTERPRISE</h1>
    <p>Admin Portal</p>
  </header>

  <main class="container">

    <!-- LOGIN -->
    <section id="loginSection" class="login-card">

      <h2>Administrator Login</h2>

      <form id="loginForm">

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          required
          autocomplete="email"
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
        >

        <button class="primary" type="submit">
          Sign In
        </button>

        <p id="loginError" class="error"></p>

      </form>

    </section>


    <!-- DASHBOARD -->
    <section id="dashboardSection" class="dashboard hidden">

      <div class="topbar">

        <div>
          <h2>Service Requests</h2>
          <p id="adminEmail"></p>
        </div>

        <div class="actions">
          <button class="refresh" id="refreshButton">
            Refresh
          </button>

          <button class="logout" id="logoutButton">
            Sign Out
          </button>
        </div>

      </div>

      <div id="requestsContainer"></div>

      <p id="dashboardMessage"></p>

    </section>

  </main>


<script>

  const SUPABASE_URL =
    "https://askvkdgdlbsjcdcwosof.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ZAmEaqe4HFkiq1vqOeNs1w_czxoSxAT";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const loginSection =
    document.getElementById("loginSection");

  const dashboardSection =
    document.getElementById("dashboardSection");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");

  const adminEmail =
    document.getElementById("adminEmail");

  const requestsContainer =
    document.getElementById("requestsContainer");

  const dashboardMessage =
    document.getElementById("dashboardMessage");


  async function checkAdmin(user) {

    const { data, error } =
      await supabaseClient
        .from("admin_users")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error) {

      console.error(error);

      return false;
    }

    return !!data;
  }


  async function loadRequests() {

    requestsContainer.innerHTML =
      "<p>Loading requests...</p>";

    const { data, error } =
      await supabaseClient
        .from("service_requests")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      console.error(error);

      requestsContainer.innerHTML =
        "<p class='error'>Unable to load service requests.</p>";

      return;
    }


    if (!data || data.length === 0) {

      requestsContainer.innerHTML =
        "<div class='empty'>No service requests yet.</div>";

      return;
    }


    requestsContainer.innerHTML =
      data.map(request => `

        <article class="request">

          <h3>
            ${escapeHtml(request.full_name || "Unnamed Client")}
          </h3>

          <div class="detail">
            <strong>Email:</strong>
            ${escapeHtml(request.email || "")}
          </div>

          <div class="detail">
            <strong>Country:</strong>
            ${escapeHtml(request.country || "Not provided")}
          </div>

          <div class="detail">
            <strong>Service:</strong>
            ${escapeHtml(request.service_type || "")}
          </div>

          <div class="detail">
            <strong>Date:</strong>
            ${escapeHtml(request.preferred_date || "Not specified")}
          </div>

          <div class="detail">
            <strong>Time:</strong>
            ${escapeHtml(request.preferred_time || "Not specified")}
          </div>

          <div class="detail">
            <strong>Duration:</strong>
            ${escapeHtml(request.duration || "Not specified")}
          </div>

          <div class="detail">
            <strong>Language:</strong>
            ${escapeHtml(request.preferred_language || "Not specified")}
          </div>

          <div class="detail">
            <strong>Description:</strong><br>
            ${escapeHtml(request.description || "")}
          </div>

          <div class="detail">
            <strong>Submitted:</strong>
            ${escapeHtml(
              request.created_at
                ? new Date(request.created_at).toLocaleString()
                : ""
            )}
          </div>

          <div class="status-row">

            <div>
              <label>Status</label>

              <select
                onchange="updateRequestStatus(
                  '${request.id}',
                  this.value
                )"
              >

                <option value="new"
                  ${request.status === "new" ? "selected" : ""}>
                  New
                </option>

                <option value="reviewing"
                  ${request.status === "reviewing" ? "selected" : ""}>
                  Reviewing
                </option>

                <option value="accepted"
                  ${request.status === "accepted" ? "selected" : ""}>
                  Accepted
                </option>

                <option value="completed"
                  ${request.status === "completed" ? "selected" : ""}>
                  Completed
                </option>

                <option value="cancelled"
                  ${request.status === "cancelled" ? "selected" : ""}>
                  Cancelled
                </option>

              </select>

            </div>


            <div>

              <label>Admin Notes</label>

              <textarea
                id="notes-${request.id}"
                placeholder="Private admin notes..."
              >${escapeHtml(request.admin_notes || "")}</textarea>

              <button
                class="refresh"
                style="margin-top:8px;"
                onclick="saveNotes('${request.id}')"
              >
                Save Notes
              </button>

            </div>

          </div>

        </article>

      `).join("");
  }


  async function updateRequestStatus(id, status) {

    const { error } =
      await supabaseClient
        .from("service_requests")
        .update({
          status: status,
          updated_at: new Date().toISOString()
        })
        .eq("id", id);

    if (error) {

      alert(
        "Could not update the request."
      );

      console.error(error);

      return;
    }

    loadRequests();
  }


  async function saveNotes(id) {

    const textarea =
      document.getElementById(
        "notes-" + id
      );

    const notes =
      textarea.value.trim();

    const { error } =
      await supabaseClient
        .from("service_requests")
        .update({
          admin_notes: notes,
          updated_at: new Date().toISOString()
        })
        .eq("id", id);

    if (error) {

      alert(
        "Could not save the notes."
      );

      console.error(error);

      return;
    }

    alert("Private admin notes saved.");
  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      loginError.textContent = "";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });


      if (error) {

        loginError.textContent =
          "Login failed. Please check your email and password.";

        console.error(error);

        return;
      }


      const user = data.user;

      const isAdmin =
        await checkAdmin(user);


      if (!isAdmin) {

        await supabaseClient.auth.signOut();

        loginError.textContent =
          "This account is not authorized as a Rycolyn administrator.";

        return;
      }


      showDashboard(user);

    }
  );


  async function showDashboard(user) {

    loginSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");

    adminEmail.textContent =
      "Signed in as: " + user.email;

    await loadRequests();
  }


  document.getElementById(
    "refreshButton"
  ).addEventListener(
    "click",
    loadRequests
  );


  document.getElementById(
    "logoutButton"
  ).addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      dashboardSection.classList.add("hidden");

      loginSection.classList.remove("hidden");

      loginForm.reset();

    }
  );


  async function initialize() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (!session) {

      return;
    }


    const isAdmin =
      await checkAdmin(session.user);


    if (isAdmin) {

      showDashboard(session.user);

    } else {

      await supabaseClient.auth.signOut();

    }
  }


  initialize();

</script>

</body>
</html>
