<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rycolyn Staff Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }
    .login-box {
      background: #fff;
      width: min(420px, 92vw);
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.35);
    }
    h1 { text-align: center; margin: 0 0 10px; }
    .subtitle { text-align: center; color: #475569; margin-bottom: 22px; }
    label { display:block; font-weight:bold; margin-bottom:8px; }
    input { width:100%; padding:12px 14px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:16px; font-size:16px; }
    button { width:100%; background:#1d4ed8; color:#fff; border:none; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:bold; cursor:pointer; }
    .error { min-height:20px; color:#b91c1c; margin:12px 0; font-weight:bold; }
    .demo { margin-top:16px; background:#eff6ff; border-radius:10px; padding:12px; color:#1e3a8a; font-size:14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Staff Login</h1>
    <p class="subtitle">Rycolyn Internal Access</p>

    <form id="staffLoginForm">
      <label for="username">Username</label>
      <input id="username" type="text" placeholder="staff" required />

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="staff123" required />

      <button type="submit">Sign In</button>
      <div id="error" class="error"></div>
    </form>

    <div class="demo">Demo staff account: staff / staff123</div>
  </div>

  <script>
    const form = document.getElementById('staffLoginForm');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Staff login failed');

        localStorage.setItem('rycolynToken', data.token);
        localStorage.setItem('rycolynUser', JSON.stringify(data.user));

        if (data.user.role === 'admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/dashboard';
        }
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
