<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rycolyn Staff Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f8fafc; color:#0f172a; }
    .topbar { background:#0f172a; color:white; padding:18px 24px; display:flex; justify-content:space-between; }
    .nav a { color:white; text-decoration:none; margin-left:14px; }
    .wrap { max-width:1100px; margin:32px auto; padding:0 16px; }
    .card { background:white; border-radius:14px; padding:24px; box-shadow:0 8px 24px rgba(15,23,42,.08); margin-bottom:18px; }
    .btn { background:#2563eb; color:white; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; }
    table { width:100%; border-collapse:collapse; margin-top:12px; }
    th, td { border:1px solid #e2e8f0; padding:10px 12px; text-align:left; }
    th { background:#f1f5f9; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; background:#dcfce7; color:#166534; }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>Rycolyn Staff Portal</strong>
    <div class="nav">
      <a href="/dashboard">Dashboard</a>
      <button class="btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>Staff Access</h1>
      <p id="welcomeText">Loading profile...</p>
      <p id="details"></p>
    </div>

    <div class="card">
      <h2>Admin Office Staff Records</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Username</th>
            <th>Email</th>
            <th>Department</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody id="staffTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('rycolynToken');
    if (!token) window.location.href = '/login';

    async function loadStaffInfo() {
      try {
        const profileResponse = await fetch('/api/users/profile', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!profileResponse.ok) {
          throw new Error('Not authorized');
        }

        const profile = await profileResponse.json();
        document.getElementById('welcomeText').textContent = `Welcome, ${profile.fullName || profile.username}!`;
        document.getElementById('details').textContent = `Role: ${profile.role} • Department: ${profile.department || 'General'} • Email: ${profile.email}`;

        const usersResponse = await fetch('/api/users/', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!usersResponse.ok) {
          throw new Error('Could not load staff list');
        }

        const users = await usersResponse.json();
        const tbody = document.getElementById('staffTableBody');
        tbody.innerHTML = users.map(user => `
          <tr>
            <td>${user.fullName || user.username}</td>
            <td>${user.username}</td>
            <td>${user.email}</td>
            <td>${user.department || 'General'}</td>
            <td><span class="pill">${user.role}</span></td>
          </tr>
        `).join('');
      } catch (error) {
        localStorage.clear();
        window.location.href = '/login';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/login';
    });

    loadStaffInfo();
  </script>
</body>
</html>
